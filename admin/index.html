<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ 관리자 | 오산대학교</title><script src="../config.js"></script><style>
:root{font-family:"Noto Sans KR",system-ui,sans-serif;color:#162d46;background:#f1f4f9}*{box-sizing:border-box}body{margin:0}header{background:#003876;color:white;padding:20px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}a{color:inherit}header a{color:white}button{cursor:pointer}main{max-width:1150px;margin:auto;padding:30px 18px}section,.box{background:white;padding:24px;border:1px solid #d7e1ed;border-radius:5px;margin:14px 0}h1{font-size:30px}h2{font-size:19px}h3{font-size:17px}.muted{color:#64748b}.field{display:block;margin:12px 0;font-size:14px;font-weight:650}.field input:not([type=checkbox]),.field textarea,.field select{display:block;width:100%;padding:11px;border:1px solid #b7c5d6;border-radius:3px;margin-top:6px;font:inherit}.field textarea{min-height:150px;resize:vertical}.btn{padding:11px 16px;border:0;border-radius:3px;background:#003876;color:white;font:inherit;margin:4px 3px 4px 0}.btn.light{background:#e6eef8;color:#003876}.btn.danger{background:#9b3245}.hidden{display:none!important}.grid{display:grid;grid-template-columns:minmax(230px,330px) minmax(0,1fr);gap:16px}.items{max-height:600px;overflow:auto}.items button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #dae3ee;padding:15px 8px;font:inherit}.items button:hover{background:#eef4fb}.items small{display:block;color:#59708b}.notice{padding:13px;background:#e8f0fb;border-left:4px solid #003876;margin-top:14px;white-space:pre-wrap}.history-row{border-bottom:1px solid #dae3ee;padding:9px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.tabnav{display:flex;flex-wrap:wrap;gap:6px}.side{min-width:0}.stat{padding:10px;color:#304e71}.stat b{font-size:20px;color:#003876}@media(max-width:750px){.grid{grid-template-columns:1fr}section,.box{padding:15px}header{padding:17px}}</style></head>
<body><header><strong>오산대학교 · 동아리 FAQ 관리</strong><div><a href="../" target="_blank" rel="noopener noreferrer">학생용 화면 ↗</a> <button class="btn light hidden" id="logout">로그아웃</button></div></header><main><h1>자주 묻는 질문 관리자</h1><section id="login-view"><h2>담당자 로그인</h2><p class="muted">등록된 담당자 한 명만 이용할 수 있습니다.</p><form id="login-form"><label class="field">사번<input id="staff" type="text" inputmode="numeric" maxlength="16" pattern="[0-9]{4,16}" autocomplete="username" required></label><label class="field">전용 비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">로그인</button></form></section>
<section id="dashboard" class="hidden"><div class="tabnav"><button class="btn light" data-page="faq">질문 관리</button><button class="btn light" data-page="category">분류 관리</button><button class="btn light" data-page="account">비밀번호 변경</button></div>
<div id="faq-panel"><p id="counts" class="stat"></p><button class="btn" id="new">+ 새 질문</button><button class="btn light" id="reload">새로고침</button><div class="grid"><div id="items" class="box items">질문 불러오는 중</div><div class="box side"><h2 id="editor-title">질문 작성</h2><form id="editor"><label class="field">카테고리<select id="category" required></select></label><label class="field">질문 제목<input id="question" maxlength="200" required></label><label class="field">답변<textarea id="answer" maxlength="10000" required placeholder="**굵게**, - 목록, [링크](https://...)"></textarea></label><label class="field">공식 링크(줄마다 HTTPS 주소 하나)<textarea id="links"></textarea></label><label class="field">표시 순서<input id="sort" type="number" min="0" max="99999" value="100"></label><label class="field"><input id="pinned" type="checkbox"> 중요 질문 고정</label><p class="muted">임시저장 내용은 게시하기 전까지 학생에게 표시되지 않습니다.</p><button class="btn light" type="submit">임시저장</button><button class="btn" id="publish" type="button">게시하기</button><button class="btn danger" id="archive" type="button">비공개</button><button class="btn light" id="show-history" type="button">수정 이력</button></form><div id="history" class="hidden"></div></div></div></div>
<div id="category-panel" class="hidden"><h2>카테고리 관리</h2><div id="category-list"></div><form id="category-form"><input id="cat-id" type="hidden"><label class="field">영문 식별자<input id="cat-slug" pattern="[a-z0-9-]+" maxlength="50" required></label><label class="field">표시 이름<input id="cat-name" maxlength="70" required></label><label class="field">표시 순서<input id="cat-order" type="number" value="100" min="0" max="99999"></label><label class="field"><input id="cat-visible" type="checkbox" checked> 학생에게 분류 공개</label><button class="btn">저장</button></form></div>
<div id="account-panel" class="hidden"><h2>비밀번호 변경</h2><form id="account-form"><label class="field">사번<input id="account-staff" required pattern="[0-9]{4,16}"></label><label class="field">현재 비밀번호<input id="old-password" type="password" required></label><label class="field">새 비밀번호 (12자 이상)<input id="new-password" type="password" minlength="12" required></label><label class="field">비밀번호 확인<input id="verify-password" type="password" minlength="12" required></label><button class="btn">변경</button></form></div></section><p id="notice" class="notice" hidden role="status" aria-live="polite"></p></main>
<script type="module">
const $=id=>document.getElementById(id),cfg=window.FAQ_CONFIG;let sb,items=[],cats=[],current=null,dirty=false;
function alertText(s){const e=$('notice');e.hidden=!s;e.textContent=s||'';}
function dirtyGuard(){return !dirty||confirm('저장하지 않은 변경사항을 취소할까요?')}
function mark(){dirty=true;$('editor-title').textContent='수정 중 · 미저장';}
const map=()=>cats.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;return o;});
async function rpc(name,args={}){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data;}
async function getClient(){if(!sb){const m=await import('https://esm.sh/@supabase/supabase-js@2.79.0');sb=m.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}})}return sb}
async function employeeLogin(staff,password){const res=await fetch(cfg.supabaseUrl+'/functions/v1/faq-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabasePublishableKey},body:JSON.stringify({employee_no:staff,password}),cache:'no-store'});const body=await res.json().catch(()=>({error:'서버 응답 형식 오류'}));if(!res.ok)throw Error(body.error||('로그인 실패 '+res.status));const r=await sb.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token});if(r.error)throw r.error}
function reset(){current=null;dirty=false;$('editor').reset();$('sort').value=100;$('editor-title').textContent='새 질문';$('history').classList.add('hidden')}
function pick(it){current=it;dirty=false;$('category').value=it.category_id;$('question').value=it.question||'';$('answer').value=it.answer_md||'';$('links').value=Array.isArray(it.related_links)?it.related_links.map(l=>l.url).join('\n'):'';$('sort').value=it.sort_order;$('pinned').checked=it.is_pinned;$('editor-title').textContent='질문 편집 · '+(it.status==='published'?'게시 중':it.status==='draft'?'임시저장':'비공개');$('history').classList.add('hidden')}
function showItems(){const root=$('items');root.replaceChildren();for(const it of items){const b=document.createElement('button');b.type='button';const title=document.createElement('b');title.textContent=it.question;const small=document.createElement('small');small.textContent=(it.status==='published'?'게시 중':it.status==='draft'?'임시저장':'비공개')+' · '+(cats.find(c=>c.id===it.category_id)?.name||'기타');b.append(title,small);b.onclick=()=>{if(dirtyGuard())pick(it)};root.append(b)}if(!items.length)root.textContent='등록된 질문이 없습니다.';$('counts').textContent='전체 '+items.length+'개 · 게시 '+items.filter(i=>i.status==='published').length+'개 · 임시 '+items.filter(i=>i.status==='draft').length+'개 · 비공개 '+items.filter(i=>i.status==='archived').length+'개'}
function showCats(){const root=$('category-list');root.replaceChildren();for(const c of cats){const row=document.createElement('div');row.className='history-row';const name=document.createElement('span');name.textContent=c.name+' ('+c.slug+') · '+(c.is_visible?'공개':'비공개');const b=document.createElement('button');b.className='btn light';b.textContent='수정';b.onclick=()=>{$('cat-id').value=c.id;$('cat-slug').value=c.slug;$('cat-name').value=c.name;$('cat-order').value=c.sort_order;$('cat-visible').checked=c.is_visible};row.append(name,b);root.append(row)}}
async function load(selectedId=current?.id){[items,cats]=await Promise.all([rpc('faq_admin_list'),rpc('faq_admin_categories')]);items.sort((a,b)=>Number(b.is_pinned)-Number(a.is_pinned)||a.sort_order-b.sort_order);const selected=$('category').value;$('category').replaceChildren(...map());if(cats.some(c=>c.id===selected))$('category').value=selected;showItems();showCats();const next=items.find(x=>x.id===selectedId);if(next)pick(next);else reset()}
function values(){const ls=$('links').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(s=>{const u=new URL(s);if(u.protocol!=='https:')throw Error('공식 링크는 HTTPS 주소만 허용됩니다.');return{label:u.hostname,url:u.href}});return{p_id:current?.id||null,p_category_id:$('category').value,p_question:$('question').value.trim(),p_answer_md:$('answer').value.trim(),p_related_links:ls,p_sort_order:Number($('sort').value),p_is_pinned:$('pinned').checked,p_expected_version:current?.version??null}}
async function save(){if(!current||dirty){const id=await rpc('faq_save_draft',values());await load(id);alertText('임시저장 완료. 게시하기를 눌러야 학생에게 보입니다.')}return current}
async function enter(){const role=await rpc('faq_my_role');if(role!=='owner')throw Error('활성화된 FAQ 관리자가 아닙니다.');$('login-view').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await load()}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await getClient();await employeeLogin($('staff').value.trim(),$('password').value);$('account-staff').value=$('staff').value.trim();await enter();alertText('관리자 로그인 성공')}catch(e){alertText('로그인 실패: '+e.message)}finally{$('password').value=''}};
$('logout').onclick=async()=>{if(!dirtyGuard())return;await sb.auth.signOut();location.reload()};
$('editor').onsubmit=async e=>{e.preventDefault();try{await save()}catch(e){alertText('저장 실패: '+e.message)}};
for(const id of ['category','question','answer','links','sort','pinned'])$(id).addEventListener('input',mark);
$('publish').onclick=async()=>{try{await save();if(!current)throw Error('질문을 먼저 등록하세요.');if(!confirm('학생에게 게시할까요?'))return;await rpc('faq_publish',{p_id:current.id,p_expected_version:current.version});await load(current.id);alertText('게시 완료')}catch(e){alertText('게시 실패: '+e.message)}};
$('archive').onclick=async()=>{if(!current)return alertText('비공개할 질문을 선택하세요.');if(!confirm('학생에게 이 질문을 숨길까요?'))return;try{await rpc('faq_archive',{p_id:current.id,p_expected_version:current.version});await load(current.id);alertText('비공개 처리 완료')}catch(e){alertText('비공개 실패: '+e.message)}};
$('show-history').onclick=async()=>{if(!current)return alertText('질문을 선택하세요.');try{const h=await rpc('faq_history',{p_id:current.id}),root=$('history');root.replaceChildren();for(const revision of h){const row=document.createElement('div');row.className='history-row';const label=document.createElement('span');label.textContent='v'+revision.revision_number+' '+revision.question+' ('+new Date(revision.created_at).toLocaleDateString('ko-KR')+')';const b=document.createElement('button');b.className='btn light';b.textContent='복원';b.onclick=async()=>{if(!confirm('이 버전을 새 임시저장으로 복원할까요?'))return;try{await rpc('faq_restore',{p_id:current.id,p_revision_id:revision.id,p_expected_version:current.version});await load(current.id);alertText('복원 완료. 다시 게시해야 학생에게 보입니다.')}catch(e){alertText(e.message)}};row.append(label,b);root.append(row)}root.classList.remove('hidden')}catch(e){alertText(e.message)}};
$('new').onclick=()=>{if(dirtyGuard())reset()};$('reload').onclick=async()=>{if(dirtyGuard())try{await load();alertText('새로고침 완료')}catch(e){alertText(e.message)}};
document.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>{if(!dirtyGuard())return;for(const n of ['faq','category','account'])$(n+'-panel').classList.toggle('hidden',n!==btn.dataset.page)});
$('category-form').onsubmit=async e=>{e.preventDefault();try{await rpc('faq_category_save',{p_id:$('cat-id').value||null,p_slug:$('cat-slug').value.trim(),p_name:$('cat-name').value.trim(),p_sort_order:Number($('cat-order').value),p_is_visible:$('cat-visible').checked});e.target.reset();$('cat-id').value='';await load();alertText('분류 저장 완료')}catch(e){alertText('분류 저장 실패: '+e.message)}};
$('account-form').onsubmit=async e=>{e.preventDefault();try{const n=$('new-password').value;if(n.length<12||n!==$('verify-password').value)throw Error('새 비밀번호는 12자 이상이고 확인 입력과 같아야 합니다.');await employeeLogin($('account-staff').value,$('old-password').value);const r=await sb.auth.updateUser({password:n});if(r.error)throw r.error;e.target.reset();alertText('비밀번호 변경 완료')}catch(e){alertText('비밀번호 변경 실패: '+e.message)}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey){alertText('FAQ 전용 서버 설정이 완료되지 않았습니다.')}else{getClient().then(async()=>{const s=(await sb.auth.getSession()).data.session;if(s)await enter()}).catch(e=>alertText(e.message))}
</script></body></html>
